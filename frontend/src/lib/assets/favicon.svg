<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- gruvbox dark bg -->
  <rect width="32" height="32" fill="#282828"/>
  <!-- outer TUI border — gruvbox bg2 -->
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#504945" stroke-width="1"/>
  <!-- title bar — gruvbox bg1 -->
  <rect x="1" y="1" width="30" height="6" fill="#3c3836"/>
  <!-- window controls — gruvbox red/yellow/green -->
  <circle cx="4" cy="4" r="1.2" fill="#cc241d"/>
  <circle cx="7.5" cy="4" r="1.2" fill="#d79921"/>
  <circle cx="11" cy="4" r="1.2" fill="#98971a"/>
  <text x="16" y="5.2" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="3.5" font-weight="700" letter-spacing="0.4" fill="#a89984">kbds — split</text>

  <!-- ASCII TUI split keyboard — box drawing in gruvbox fg -->
  <g font-family="'JetBrains Mono', monospace" text-anchor="middle">
    <!-- top border -->
    <text x="16" y="13.5" font-size="4" fill="#ebdbb2" letter-spacing="0.2">┌──┐ ┌──┐</text>
    <!-- label KB | DS — gruvbox bright yellow / green -->
    <text x="16" y="20" font-size="7" font-weight="700" letter-spacing="0.3">
      <tspan fill="#fabd2f">KB</tspan><tspan fill="#665c54" font-size="5">│</tspan><tspan fill="#b8bb26">DS</tspan>
    </text>
    <!-- bottom border -->
    <text x="16" y="24.5" font-size="4" fill="#ebdbb2" letter-spacing="0.2">└──┘ └──┘</text>
  </g>
  <!-- subtle split gap indicator -->
  <rect x="15.5" y="11" width="1" height="15" fill="#1d2021" opacity="0.9"/>
  <rect x="15.7" y="11" width="0.6" height="15" fill="#504945" opacity="0.6"/>
</svg>
